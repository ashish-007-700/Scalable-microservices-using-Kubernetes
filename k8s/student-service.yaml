# Kubernetes Service for Student Service
# Exposes the Student Service pods via a NodePort so it can be accessed from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: student-service
  labels:
    app: student-service
spec:
  type: NodePort
  selector:
    app: student-service
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
      nodePort: 30001
