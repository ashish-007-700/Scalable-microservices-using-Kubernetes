# Kubernetes Service for Course Service
# Exposes the Course Service pods via a NodePort so it can be accessed from outside the cluster
apiVersion: v1
kind: Service
metadata:
  name: course-service
  labels:
    app: course-service
spec:
  type: NodePort
  selector:
    app: course-service
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
      nodePort: 30002
